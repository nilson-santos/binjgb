<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Legend of Zelda: Link's Awakening DX (BR) — BINJGB</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    /* Handheld shell in Zelda green and gold behind the touch controls. */
    #game.ejs_small_screen::after {
      content: "";
      position: absolute;
      inset: 90vw 0 0;
      background:
        radial-gradient(ellipse at 50% 115%, #94b75f33, transparent 65%),
        repeating-linear-gradient(135deg, transparent 0 10px, #ffffff08 10px 11px),
        linear-gradient(180deg, #28563c, #184331 62%, #102d23);
      border-top: 3px solid #d0ae6a;
      box-shadow: inset 0 10px 18px #0a2419b3, 0 -5px 20px #0006;
      pointer-events: none;
      z-index: 2;
    }
    @media (orientation: landscape) {
      #game.ejs_small_screen::after { inset: auto 0 0; height: 50dvh; }
    }
    #game.ejs_small_screen::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 200px;
      width: 76px;
      height: 72px;
      transform: translateX(-50%);
      background: url('./triforce.svg') center / contain no-repeat;
      filter: drop-shadow(0 2px 5px #0a2419);
      opacity: .8;
      pointer-events: none;
      z-index: 3;
    }
    #game.ejs_small_screen .ejs_virtualGamepad_parent {
      bottom: calc(95px + env(safe-area-inset-bottom, 0px)) !important;
      z-index: 4;
    }
    @media (max-height: 650px) {
      #game.ejs_small_screen .ejs_virtualGamepad_parent {
        bottom: calc(70px + env(safe-area-inset-bottom, 0px)) !important;
      }
    }
    /* EmulatorJS owns the menu layout and the native mobile menu button. */
    #game.ejs_small_screen .ejs_virtualGamepad_parent { display: block !important; }
    #game .ejs_virtualGamepad_button.b_a {
      background: radial-gradient(circle at 30% 25%, #f7dd92, #c89b3c 70%, #705021) !important;
      border-color: #f9ebbf !important;
      color: #173b2b !important;
      box-shadow: 0 0 0 2px #233d29, 0 4px 12px #0009 !important;
    }
    #game .ejs_virtualGamepad_button.b_b {
      background: radial-gradient(circle at 30% 25%, #4b8058, #244c36 70%, #132d23) !important;
      border-color: #d6b66b !important;
      color: #fff4c7 !important;
      box-shadow: 0 0 0 2px #142c21, 0 4px 12px #0009 !important;
    }
    #game .ejs_virtualGamepad_button.b_start,
    #game .ejs_virtualGamepad_button.b_select {
      background: linear-gradient(#f7e7b8, #c9ac65) !important;
      border-color: #715326 !important;
      color: #193829 !important;
    }
    #game .ejs_virtualGamepad_button.b_speed_fast,
    #game .ejs_virtualGamepad_button.b_speed_slow {
      background: #244b38d9 !important;
      border-color: #bc9d5c !important;
      color: #fff1bf !important;
    }
    #game .ejs_dpad_main { opacity: 1 !important; }
    #game .ejs_dpad_bar {
      background: #102f24 !important;
      box-shadow: inset 0 0 0 2px #c4a55c, 0 3px 8px #071e16cc !important;
    }
    #game .ejs_dpad_horizontal::before { border-right-color: #f4d990 !important; }
    #game .ejs_dpad_horizontal::after { border-left-color: #f4d990 !important; }
    #game .ejs_dpad_vertical::before { border-bottom-color: #f4d990 !important; }
    #game .ejs_dpad_vertical::after { border-top-color: #f4d990 !important; }
  </style>
</head>
<body>
  <div id="game" aria-label="Emulador de Game Boy executando The Legend of Zelda: Link's Awakening DX (BR)"></div>
  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'gb';
    window.EJS_gameName = "The Legend of Zelda: Link's Awakening DX (BR)";
    window.EJS_gameUrl = './links-awakening-dx-br.gbc?v=3da8a8fe';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/nightly/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_language = 'pt-BR';
    window.EJS_onGameStart = () => {
      document.querySelector('#game .ejs_menu_bar')?.classList.add('ejs_menu_bar_hidden');
    };
  </script>
  <script src="https://cdn.emulatorjs.org/nightly/data/loader.js"></script>
</body>
</html>
