<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Legend of Zelda: Link's Awakening DX (BR) — BINJGB</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    html:not(.menu-open) #game .ejs_menu_bar { display: none !important; }
    html.menu-open #game .ejs_menu_bar {
      display: flex !important;
      opacity: 1 !important;
      transform: none !important;
      pointer-events: auto !important;
    }
    #menu-toggle {
      position: fixed; top: 12px; right: 12px; z-index: 9999;
      padding: 8px 12px; border: 1px solid #ffffff80; border-radius: 8px;
      background: #000b; color: #fff; font: 600 14px system-ui, sans-serif;
      cursor: pointer;
    }
    #menu-toggle:hover, #menu-toggle:focus-visible { background: #000; }
  </style>
</head>
<body>
  <div id="game" aria-label="Emulador de Game Boy executando The Legend of Zelda: Link's Awakening DX (BR)"></div>
  <button id="menu-toggle" type="button" aria-controls="game" aria-expanded="false">Menu</button>
  <script>
    const menuButton = document.getElementById('menu-toggle');
    menuButton.addEventListener('click', () => {
      const open = document.documentElement.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.textContent = open ? 'Fechar menu' : 'Menu';
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.documentElement.classList.contains('menu-open')) {
        document.documentElement.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.textContent = 'Menu';
      }
    });
    window.EJS_player = '#game';
    window.EJS_core = 'gb';
    window.EJS_browserMode = 'mobile';
    window.EJS_gameName = "The Legend of Zelda: Link's Awakening DX (BR)";
    window.EJS_gameUrl = './links-awakening-dx-br.gbc?v=3da8a8fe';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/nightly/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_language = 'pt-BR';
  </script>
  <script src="https://cdn.emulatorjs.org/nightly/data/loader.js"></script>
</body>
</html>
