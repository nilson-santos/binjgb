<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Legend of Zelda: Link's Awakening DX (BR) — BINJGB</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    html:not(.menu-open) #game .ejs_menu_bar { display: none !important; }
    html.menu-open #game .ejs_menu_bar {
      display: flex !important;
      opacity: 1 !important;
      transform: none !important;
      pointer-events: auto !important;
    }
    html.menu-open #game.ejs_small_screen .ejs_menu_bar {
      transform: translate(-50%, 0) !important;
    }
    /* Zelda-inspired palette for touch controls. Keep EmulatorJS hit areas intact. */
    #game .ejs_virtualGamepad_button.b_a {
      background: radial-gradient(circle at 30% 25%, #f7dd92, #c89b3c 70%, #705021) !important;
      border: 3px solid #f9ebbf !important;
      color: #173b2b !important;
      box-shadow: 0 0 0 3px #233d29, 0 4px 12px #0009 !important;
    }
    #game .ejs_virtualGamepad_button.b_b {
      background: radial-gradient(circle at 30% 25%, #4b8058, #244c36 70%, #132d23) !important;
      border: 3px solid #d6b66b !important;
      color: #fff4c7 !important;
      box-shadow: 0 0 0 3px #142c21, 0 4px 12px #0009 !important;
    }
    #game .ejs_virtualGamepad_button.b_start,
    #game .ejs_virtualGamepad_button.b_select {
      background: linear-gradient(#f7e7b8, #c9ac65) !important;
      border: 2px solid #715326 !important;
      color: #193829 !important;
      box-shadow: 0 3px 8px #0008 !important;
    }
    #game .ejs_virtualGamepad_button.b_speed_fast,
    #game .ejs_virtualGamepad_button.b_speed_slow {
      background: #244b38d9 !important;
      border: 1px solid #bc9d5c !important;
      color: #fff1bf !important;
    }
    #game .ejs_virtualGamepad_button_down {
      filter: brightness(1.3);
      transform: scale(.94);
    }
    #game .ejs_dpad_bar {
      background: #254b36 !important;
      border: 2px solid #bd9b56 !important;
      box-shadow: inset 0 2px 4px #0d271b, 0 2px 8px #0008 !important;
    }
    #game .ejs_dpad_horizontal::before { border-right-color: #f4d990 !important; }
    #game .ejs_dpad_horizontal::after { border-left-color: #f4d990 !important; }
    #game .ejs_dpad_vertical::before { border-bottom-color: #f4d990 !important; }
    #game .ejs_dpad_vertical::after { border-top-color: #f4d990 !important; }
    #game .ejs_virtualGamepad_parent { display: block !important; }
    #menu-toggle {
      position: fixed; top: 12px; right: 12px; z-index: 9999;
      padding: 8px 12px; border: 1px solid #ffffff80; border-radius: 8px;
      background: #000b; color: #fff; font: 600 14px system-ui, sans-serif;
      cursor: pointer;
    }
    #menu-toggle:hover, #menu-toggle:focus-visible { background: #000; }
  </style>
</head>
<body>
  <div id="game" aria-label="Emulador de Game Boy executando The Legend of Zelda: Link's Awakening DX (BR)"></div>
  <button id="menu-toggle" type="button" aria-controls="game" aria-expanded="false">Menu</button>
  <script>
    const menuButton = document.getElementById('menu-toggle');
    menuButton.addEventListener('click', () => {
      const open = document.documentElement.classList.toggle('menu-open');
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.textContent = open ? 'Fechar menu' : 'Menu';
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.documentElement.classList.contains('menu-open')) {
        document.documentElement.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.textContent = 'Menu';
      }
    });
    window.EJS_player = '#game';
    window.EJS_core = 'gb';
    window.EJS_browserMode = 'mobile';
    window.EJS_gameName = "The Legend of Zelda: Link's Awakening DX (BR)";
    window.EJS_gameUrl = './links-awakening-dx-br.gbc?v=3da8a8fe';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/nightly/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_language = 'pt-BR';
  </script>
  <script src="https://cdn.emulatorjs.org/nightly/data/loader.js"></script>
</body>
</html>
